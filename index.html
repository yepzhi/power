<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Intelligence | Richmond Pro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    


    <style>
        :root {
            --bg-deep: #050510;
            --bg-card: rgba(255, 255, 255, 0.03);
            --primary: #277eff;
            --primary-glow: rgba(39, 126, 255, 0.4);
            --accent: #00f2ff;
            --accent-glow: rgba(0, 242, 255, 0.4);
            --danger: #ff3b30;
            --danger-bg: rgba(255, 59, 48, 0.1);
            --success: #00e676;
            --border: rgba(39, 126, 255, 0.15);
            --text: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.6);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(39, 126, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 255, 0.05) 0%, transparent 40%);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-head { font-family: 'Outfit', sans-serif; }

        .dashboard-container { max-width: 1500px; margin: 0 auto; padding: 25px; }

        /* ── Header ── */
        header { display: flex; flex-direction: column; gap: 20px; margin-bottom: 30px; }
        @media(min-width: 992px) { header { flex-direction: row; justify-content: space-between; align-items: flex-end; } }
        
        .header-title h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: -0.04em; text-transform: uppercase; line-height: 1; }
        .header-title span { color: var(--primary); text-shadow: 0 0 20px var(--primary-glow); }
        .header-title p { color: var(--text-muted); font-size: 0.9rem; margin-top: 8px; font-weight: 500; }

        /* ── Filters ── */
        .filters-bar {
            display: flex; flex-wrap: wrap; gap: 15px;
            background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border);
            padding: 18px 25px; border-radius: 20px; backdrop-filter: blur(15px);
            position: sticky; top: 20px; z-index: 1000;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6); margin-bottom: 35px;
        }

        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 280px; }
        .filter-group label { font-size: 0.7rem; font-weight: 800; color: var(--accent); text-transform: uppercase; letter-spacing: 0.12em; }

        /* Tom Select Style */
        .ts-control { background: rgba(0,0,0,0.5) !important; border: 1px solid var(--border) !important; border-radius: 12px !important; color: #fff !important; padding: 12px 15px !important; transition: all 0.3s; }
        .ts-control:hover { border-color: var(--primary) !important; }
        .ts-dropdown { background: #0a0a1a !important; border: 1px solid var(--primary) !important; border-radius: 12px !important; color: #fff !important; margin-top: 5px !important; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.9) !important; }
        .ts-dropdown .option { padding: 12px 15px !important; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .ts-dropdown .option:hover { background: var(--primary) !important; }

        /* ── Tabs ── */
        .tabs-nav { display: flex; gap: 8px; margin-bottom: 30px; background: rgba(255,255,255,0.02); padding: 6px; border-radius: 14px; width: fit-content; border: 1px solid var(--glass-border); }
        .tab-btn {
            background: transparent; border: none; color: var(--text-muted); font-family: 'Outfit', sans-serif;
            font-weight: 700; font-size: 1rem; padding: 12px 25px; cursor: pointer; border-radius: 10px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .tab-btn.active { color: #fff; background: var(--primary); box-shadow: 0 5px 15px var(--primary-glow); }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* ── KPI Row ── */
        .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 35px; }
        .kpi-card { 
            background: linear-gradient(135deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 25px; 
            position: relative; overflow: hidden; backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }
        .kpi-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .kpi-card::after { content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 3px; background: linear-gradient(90deg, transparent, var(--primary), transparent); opacity: 0.5; }
        
        .kpi-label { font-size: 0.75rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 10px; }
        .kpi-value { font-size: 2.2rem; font-weight: 900; font-family: 'Outfit', sans-serif; display: flex; align-items: baseline; gap: 8px; }
        .kpi-trend { font-size: 0.9rem; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .up { color: var(--success); background: rgba(0, 230, 118, 0.1); }
        .down { color: var(--danger); background: rgba(255, 59, 48, 0.1); }

        /* ── Visual Cards (iFrames) ── */
        .grid-main { display: grid; grid-template-columns: 1fr; gap: 30px; }
        @media(min-width: 1200px) { .grid-main { grid-template-columns: 1fr 1fr; } }

        .card { 
            background: rgba(255, 255, 255, 0.02); border: 1px solid var(--glass-border); 
            border-radius: 28px; padding: 25px; position: relative; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
        }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .card-title { font-size: 1.3rem; font-weight: 800; display: flex; align-items: center; gap: 10px; }
        .card-title svg { color: var(--primary); }

        .iframe-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 18px; 
            overflow: hidden; border: 1px solid rgba(255,255,255,0.05);
            position: relative;
        }
        .iframe-wrapper iframe { width: 100%; height: 100%; border: none; }

        .full-card { grid-column: 1 / -1; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        footer { margin-top: 60px; padding: 40px 0; text-align: center; border-top: 1px solid var(--glass-border); color: var(--text-muted); font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <header>
            <div class="header-title">
                <h1>Power <span>Intelligence</span></h1>
                <p>Richmond Pro Premium Analytics Console</p>
            </div>
        </header>

        <!-- OPERATIONAL VIEW -->
        <div id="tab-operational">
            <div class="grid-main">
                <div class="card full-card">
                    <div class="card-header" style="flex-direction: column; align-items: flex-start; gap: 8px;">
                        <h3 class="card-title" style="font-size: 1.1rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg> View Assignments by Teacher</h3>
                        <h3 class="card-title" style="font-size: 1.1rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg> View Tests by Teacher</h3>
                        <h3 class="card-title" style="font-size: 1.1rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg> Activities by Student</h3>
                        <h3 class="card-title" style="font-size: 1.1rem;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"></polyline></svg> More Active Hours and Devices</h3>
                    </div>
                    <div class="iframe-wrapper" style="aspect-ratio: 21/9;">
                        <iframe id="iframe-trend" title="Tablero_RLP" src="https://app.powerbi.com/reportEmbed?reportId=29053dbc-bcd3-4fa1-9152-2587af720778&autoAuth=true&ctid=7516bb18-282c-4e63-b1ec-795805f1e8fd&actionBarEnabled=true" allowFullScreen="true"></iframe>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 Richmond Pro Education Platform. Securely Integrated via URL Filtering.</p>
        </footer>

    </div>


</body>
</html>
